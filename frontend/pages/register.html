<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | India Shared Transport Network</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="brand-container">
      <a href="../index.html" style="display:flex; align-items:center; gap:12px;">
        <div class="brand-icon-badge">🚚</div>
        <div class="brand-text">
          <span class="brand-title">INDIA SHARED</span>
          <span class="brand-subtitle">TRANSPORT NETWORK</span>
        </div>
      </a>
    </div>
    <div class="header-nav">
      <a href="../index.html" class="btn btn-ghost-light">Home</a>
      <a href="login.html" class="btn btn-solid-white">Login</a>
    </div>
  </header>

  <main class="main-container" style="max-width: 540px;">
    <div class="card">
      <h2 class="card-title">CREATE AN ACCOUNT</h2>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">FULL NAME / CONTACT PERSON</label>
          <input type="text" id="name" class="form-control" placeholder="Rajesh Kumar" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-control" placeholder="rajesh@company.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">PASSWORD</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="phone">PHONE NUMBER</label>
            <input type="tel" id="phone" class="form-control" placeholder="9876543210" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="companyName">COMPANY / FIRM NAME</label>
            <input type="text" id="companyName" class="form-control" placeholder="Deccan Transports" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="role">SELECT PLATFORM ROLE</label>
          <select id="role" class="form-control" required>
            <option value="BUSINESS">🏢 BUSINESS (Shipper / Cargo Owner)</option>
            <option value="TRUCK_OWNER">🚛 TRUCK OWNER (Fleet Operator / Transporter)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-solid-dark btn-block">REGISTER ACCOUNT</button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--color-text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 700; color: var(--color-dark-navy);">Login here</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { API } from '../js/api.js';

    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('role');
    if (roleParam === 'TRANSPORTER' || roleParam === 'TRUCK_OWNER') {
      document.getElementById('role').value = 'TRUCK_OWNER';
    } else if (roleParam === 'SHIPPER' || roleParam === 'BUSINESS') {
      document.getElementById('role').value = 'BUSINESS';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value;
      const companyName = document.getElementById('companyName').value;
      const role = document.getElementById('role').value;

      try {
        const res = await API.post('/auth/register', { name, email, password, phone, companyName, role });
        API.setToken(res.token);
        API.setUser(res.user);
        alert('Registration successful!');

        if (res.user.role === 'TRUCK_OWNER' || res.user.role === 'TRANSPORTER') {
          window.location.href = 'truck-owner-dashboard.html';
        } else {
          window.location.href = 'business-dashboard.html';
        }
      } catch (err) {
        alert(err.message || 'Registration failed.');
      }
    });
  </script>
</body>
</html>
