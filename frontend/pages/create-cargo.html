<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Cargo | India Shared Transport Network</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/notifications.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="brand-container">
      <a href="business-dashboard.html" style="display:flex; align-items:center; gap:12px;">
        <div class="brand-icon-badge">📦</div>
        <div class="brand-text">
          <span class="brand-title">CREATE CARGO</span>
          <span class="brand-subtitle">POST NEW SHIPMENT</span>
        </div>
      </a>
    </div>
    <div class="header-nav" id="header-nav-actions"></div>
  </header>

  <main class="main-container" style="max-width:700px;">
    <!-- Sub Navigation Tabs -->
    <nav class="sub-nav-tabs">
      <a href="business-dashboard.html">Dashboard</a>
      <a href="create-cargo.html" class="active">Create Cargo</a>
      <a href="business-bookings.html">Bookings & Status</a>
      <a href="tracking.html">Shipment Tracking</a>
    </nav>

    <div class="card">
      <h2 class="card-title">POST NEW CARGO SHIPMENT</h2>
      <form id="create-cargo-form">
        <div class="form-group">
          <label class="form-label" for="cargoName">CARGO NAME / TITLE</label>
          <input type="text" id="cargoName" class="form-control" placeholder="Enter cargo name" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pickupLocation">PICKUP LOCATION (CITY)</label>
            <input type="text" id="pickupLocation" class="form-control" placeholder="Enter pickup location" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="destination">DESTINATION (CITY)</label>
            <input type="text" id="destination" class="form-control" placeholder="Enter destination location" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="weight">WEIGHT (IN TONS)</label>
            <input type="number" step="0.1" id="weight" class="form-control" placeholder="Enter cargo weight in tons" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="preferredVehicleType">PREFERRED VEHICLE TYPE</label>
            <select id="preferredVehicleType" class="form-control">
              <option value="Container 20ft">Container 20ft</option>
              <option value="Container 32ft">Container 32ft</option>
              <option value="Open Body">Open Body</option>
              <option value="Refrigerated">Refrigerated</option>
              <option value="Trailer">Trailer</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pickupDate">PICKUP DATE</label>
            <input type="date" id="pickupDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="requiredDeliveryDate">REQUIRED DELIVERY DATE</label>
            <input type="date" id="requiredDeliveryDate" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">CARGO DESCRIPTION</label>
          <textarea id="description" class="form-control" rows="3" placeholder="Describe cargo contents, packaging type, etc."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="specialHandling">SPECIAL HANDLING INSTRUCTIONS</label>
          <input type="text" id="specialHandling" class="form-control" placeholder="e.g. Fragile, Moisture protection required">
        </div>

        <button type="submit" class="btn btn-solid-dark btn-block">SAVE CARGO & FIND TRUCKS &rarr;</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { BusinessModule } from '../js/business.js';
    document.addEventListener('DOMContentLoaded', () => {
      // Set default dates
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('pickupDate').value = today;
      document.getElementById('requiredDeliveryDate').value = today;
      BusinessModule.initCreateForm();
    });
  </script>
</body>
</html>
