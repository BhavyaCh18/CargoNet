<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints & Support | India Shared Transport Network</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="brand-container">
      <a href="admin-dashboard.html" style="display:flex; align-items:center; gap:12px;">
        <div class="brand-icon-badge">⚠️</div>
        <div class="brand-text">
          <span class="brand-title">COMPLAINTS & ISSUES</span>
          <span class="brand-subtitle">RESOLVE USER DISPUTES</span>
        </div>
      </a>
    </div>
    <div class="header-nav" id="header-nav-actions"></div>
  </header>

  <main class="main-container">
    <div class="card">
      <div class="card-title">USER COMPLAINTS & TICKETS</div>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Subject</th>
              <th>Description</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="admin-complaints-list">
            <tr><td colspan="6" style="text-align:center; padding:20px;">Loading complaints...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { AdminModule } from '../js/admin.js';
    document.addEventListener('DOMContentLoaded', () => {
      AdminModule.loadComplaints();
    });
  </script>
</body>
</html>
