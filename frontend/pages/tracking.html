<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipment Live Tracking | India Shared Transport Network</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="../js/notifications.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="brand-container">
      <a href="../index.html" style="display:flex; align-items:center; gap:12px;">
        <div class="brand-icon-badge">📍</div>
        <div class="brand-text">
          <span class="brand-title">LIVE TRACKING</span>
          <span class="brand-subtitle">GPS & ROUTE VISUALIZATION</span>
        </div>
      </a>
    </div>
    <div class="header-nav" id="header-nav-actions"></div>
  </header>

  <main class="main-container">
    <!-- Sub Navigation Tabs -->
    <nav class="sub-nav-tabs">
      <a href="business-dashboard.html">Dashboard</a>
      <a href="create-cargo.html">Create Cargo</a>
      <a href="business-bookings.html">Bookings & Status</a>
      <a href="tracking.html" class="active">Shipment Tracking</a>
    </nav>

    <div class="card" id="tracking-info-card">
      <p style="color:#64748B;">Loading tracking data...</p>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div id="leaflet-map" style="width:100%; height:450px;"></div>
    </div>
  </main>

  <script type="module">
    import { TrackingModule } from '../js/tracking.js';
    document.addEventListener('DOMContentLoaded', () => {
      TrackingModule.init();
    });
  </script>
</body>
</html>
