<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Fleet | India Shared Transport Network</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="brand-container">
      <a href="truck-owner-dashboard.html" style="display:flex; align-items:center; gap:12px;">
        <div class="brand-icon-badge">🚛</div>
        <div class="brand-text">
          <span class="brand-title">MY FLEET</span>
          <span class="brand-subtitle">REGISTERED VEHICLES</span>
        </div>
      </a>
    </div>
    <div class="header-nav" id="header-nav-actions"></div>
  </header>

  <main class="main-container">
    <!-- Sub Navigation Tabs -->
    <nav class="sub-nav-tabs">
      <a href="truck-owner-dashboard.html">Dashboard</a>
      <a href="my-fleet.html" class="active">My Fleet</a>
      <a href="register-truck.html">Register Truck</a>
      <a href="truck-bookings.html">Bookings</a>
      <a href="return-loads.html" style="color:#F97316;">Return Loads 🔥</a>
      <a href="earnings.html">Earnings & Impact</a>
    </nav>

    <div class="card">
      <div class="card-title">
        <span>MY TRUCK FLEET</span>
        <a href="register-truck.html" class="btn btn-outline-dark" style="padding:4px 12px; font-size:0.75rem;">+ Register Truck</a>
      </div>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Vehicle Number</th>
              <th>Type</th>
              <th>Route</th>
              <th>Capacity</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="my-fleet-list">
            <tr><td colspan="7" style="text-align:center; padding:20px;">Loading fleet data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { TruckOwnerModule } from '../js/truck-owner.js';
    document.addEventListener('DOMContentLoaded', () => {
      TruckOwnerModule.loadMyFleet();
    });
  </script>
</body>
</html>
