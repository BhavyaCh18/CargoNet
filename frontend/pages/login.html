<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | India Shared Transport Network</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="brand-container">
      <a href="../index.html" style="display:flex; align-items:center; gap:12px;">
        <div class="brand-icon-badge">🚚</div>
        <div class="brand-text">
          <span class="brand-title">INDIA SHARED</span>
          <span class="brand-subtitle">TRANSPORT NETWORK</span>
        </div>
      </a>
    </div>
    <div class="header-nav">
      <a href="../index.html" class="btn btn-ghost-light">Home</a>
      <a href="register.html" class="btn btn-solid-white">Register Free</a>
    </div>
  </header>

  <main class="main-container" style="max-width: 480px;">
    <div class="card">
      <h2 class="card-title">ACCOUNT LOGIN</h2>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-control" placeholder="user@company.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">PASSWORD</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-solid-dark btn-block">LOGIN TO PLATFORM</button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--color-text-muted);">
        Don't have an account? <a href="register.html" style="font-weight: 700; color: var(--color-dark-navy);">Register here</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { API } from '../js/api.js';

    // Auto fill demo email if query param exists
    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('role');
    if (roleParam === 'ADMIN') {
      document.getElementById('email').value = 'admin@cargonet.in';
      document.getElementById('password').value = 'password123';
    } else if (roleParam === 'TRANSPORTER' || roleParam === 'TRUCK_OWNER') {
      document.getElementById('email').value = 'truckowner1@cargonet.in';
      document.getElementById('password').value = 'password123';
    } else if (roleParam === 'SHIPPER' || roleParam === 'BUSINESS') {
      document.getElementById('email').value = 'businessA@cargonet.in';
      document.getElementById('password').value = 'password123';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await API.post('/auth/login', { email, password });
        API.setToken(res.token);
        API.setUser(res.user);

        if (res.user.role === 'TRUCK_OWNER' || res.user.role === 'TRANSPORTER') {
          window.location.href = 'truck-owner-dashboard.html';
        } else if (res.user.role === 'ADMIN') {
          window.location.href = 'admin-dashboard.html';
        } else {
          window.location.href = 'business-dashboard.html';
        }
      } catch (err) {
        alert(err.message || 'Login failed.');
      }
    });
  </script>
</body>
</html>
